# Hope School — nginx site config
#
# Install:
#   # rate-limit zones first (they live in the http context):
#   sudo cp deploy/nginx-ratelimit.conf /etc/nginx/conf.d/hopeschool-ratelimit.conf
#   # then this site:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/hopeschool
#   sudo ln -s /etc/nginx/sites-available/hopeschool /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain a certificate — certbot rewrites this file to add the TLS server
# block and the HTTP->HTTPS redirect automatically:
#   sudo certbot --nginx -d hopeschool.uz -d www.hopeschool.uz
#
# Replace hopeschool.uz / paths to match your server before installing.

upstream hopeschool_app {
    server unix:/run/hopeschool/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name hopeschool.uz www.hopeschool.uz;

    # Allow admin uploads of images and (self-hosted) video files. Django itself
    # does not cap uploaded *file* size, so the edge limit is what matters here.
    # Prefer YouTube/Vimeo URLs for video to keep this low.
    client_max_body_size 100m;

    # Cap concurrent connections per IP (slow-loris / connection floods).
    limit_conn hs_conn 20;

    # --- Proxy headers (inherited by every location that proxy_passes) ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Tells Django (SECURE_PROXY_SSL_HEADER) the original scheme was HTTPS.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/xml image/svg+xml application/manifest+json;

    # --- Security headers ---
    # X-Frame-Options / X-Content-Type-Options / Referrer-Policy are also set by
    # Django; repeating the static ones at the edge is harmless belt-and-braces.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- Content-Security-Policy (OPTIONAL — TEST BEFORE ENABLING) ---
    # A wrong CSP silently breaks fonts, maps, analytics, video embeds and the
    # admin map picker. The policy below allows every external origin this site
    # actually uses. Uncomment (it MUST stay one physical line — nginx has no
    # line-continuation inside a quoted value), reload nginx, then open the
    # browser console on each page (home, course detail with video, contact map,
    # and the admin SiteConfig map) and confirm there are no "Refused to load …
    # CSP" errors.
    #
    #   add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://mc.yandex.ru https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://mc.yandex.ru https://www.google-analytics.com https://unpkg.com https://*.tile.openstreetmap.org; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://mc.yandex.ru; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.google.com https://yandex.com https://yandex.uz; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Let's Encrypt HTTP-01 challenge (certbot manages this dir).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # NOTE: nginx `add_header` REPLACES (not merges) inherited headers, so any
    # location with its own add_header must repeat the security headers below or
    # it silently loses them. This matters most on /media/ (untrusted uploads).

    # ----- Static files (collectstatic → staticfiles/, served by nginx) -----
    location /static/ {
        alias /home/hopeschool/app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ----- Media (user/admin uploads). whitenoise serves STATIC only; nginx
    # must serve MEDIA_ROOT so uploaded images and video_file play. -----
    location /media/ {
        alias /home/hopeschool/app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        # Re-assert security headers — uploaded files are exactly where
        # MIME-sniffing protection counts.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # ----- Lead form: strict per-IP rate limit (writes DB + sends Telegram) -----
    location = /ariza/ {
        limit_req zone=hs_form burst=5 nodelay;
        proxy_pass http://hopeschool_app;
    }

    # ----- Admin login: rate-limited to slow brute-force attempts -----
    location = /admin/login/ {
        limit_req zone=hs_login burst=10 nodelay;
        proxy_pass http://hopeschool_app;
    }

    # ----- Everything else (the application) -----
    location / {
        limit_req zone=hs_general burst=40 nodelay;
        proxy_pass http://hopeschool_app;
    }
}

{% load i18n %}
{% if home_video.is_enabled and home_video.has_video %}
<section id="video" class="py-12 lg:py-16 bg-alt">
  <div class="mx-auto max-w-4xl px-4 lg:px-8">
    {% if home_video.title %}
    <div class="sr text-center max-w-2xl mx-auto mb-8">
      <h2 class="font-display font-extrabold tracking-tight text-[clamp(1.7rem,3.4vw,2.5rem)] leading-tight">{{ home_video.title }}</h2>
      {% if home_video.subtitle %}<p class="mt-3 text-[16px] leading-relaxed txt-soft">{{ home_video.subtitle }}</p>{% endif %}
    </div>
    {% endif %}
    <div class="sr shadow-strong rounded-card overflow-hidden">
      {% include "partials/_video.html" with video=home_video title=home_video.title %}
    </div>
  </div>
</section>
{% endif %}

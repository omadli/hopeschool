{# ---- Analytics (gated on configured IDs; renders nothing when empty) ---- #}
{% if site_config.ga4_measurement_id %}
{# Google Analytics 4 (gtag.js) #}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site_config.ga4_measurement_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site_config.ga4_measurement_id }}');
</script>
{% endif %}
